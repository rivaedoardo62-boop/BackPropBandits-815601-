[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "esef-extraction"
version = "0.1.0"
description = "Estrazione deterministica e tracciabile di indicatori finanziari da relazioni ESEF (xBRL-JSON) di emittenti quotati italiani"
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Versioni fissate. L'elenco completo (dipendenze transitive incluse, con hash)
# e' in requirements.lock, generato con:
#   pip-compile --generate-hashes --extra test --output-file requirements.lock pyproject.toml
dependencies = [
    "requests==2.34.2",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "pyyaml==6.0.3",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
esef = "extraction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
