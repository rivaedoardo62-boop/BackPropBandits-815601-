[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "esef-extraction"
version = "0.1.0"
description = "Estrazione deterministica di indicatori finanziari da relazioni ESEF di emittenti quotati italiani (prototipo, Fase 1)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Versioni fissate. L'albero completo delle dipendenze transitive, con hash,
# è in requirements.lock (generato con `uv pip compile`, vedi README).
dependencies = [
    "requests==2.34.2",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "pyyaml==6.0.3",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
esef-extraction = "extraction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
