[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "esef-extraction"
version = "0.1.0"
description = "Estrazione deterministica e tracciabile di indicatori finanziari dalle relazioni ESEF degli emittenti quotati italiani (prototipo, Fase 1)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Versioni fissate. Il lock completo (dipendenze transitive con hash) e' in
# requirements.lock: rigenerarlo quando si cambia una versione qui (vedi README).
dependencies = [
    "requests==2.34.2",
    "pandas==3.0.6",
    "pyyaml==6.0.3",
    "pydantic==2.13.5",
    # Richiesto da pandas per scrivere/leggere parquet (output del Passo 6).
    "pyarrow==25.0.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
esef-extraction = "extraction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
