# Campione di emittenti (Passo 3) - PROPOSTA IN ATTESA DI APPROVAZIONE.
#
# - filings.xbrl.org non riporta ne' il settore ne' l'indice/segmento:
#   `sector`, `sector_group` e `segment` sono PROPOSTE dell'assistente, da
#   verificare (la composizione degli indici FTSE Italia cambia ogni trimestre).
# - `name` serve solo alla lettura: il nome usato negli output e' quello
#   restituito dall'API per il LEI.
# - `status`: proposed (nel campione proposto) | reserve (riserva) |
#   approved | rejected. Il download del Passo 4 riguardera' solo `approved`.
# - Criteri usati: relazioni con fine periodo 31/12 per entrambi gli esercizi,
#   xBRL-JSON disponibile, nessun errore di validazione segnalato dall'API,
#   societa' di diritto italiano, preferenza per esercizi con una sola versione
#   (Italgas e' incluso apposta come caso con versione italiana e inglese).

fiscal_years: [2024, 2025]
# Esercizio = anno della data di fine periodo; si accettano solo chiusure al 31/12.
period_end_month_day: "12-31"

sector_groups: [industriali_servizi, utility, banca, assicurazione]
segments: [FTSE MIB, Mid Cap, Small Cap, STAR]

