# Passo 3 - Proposta di campione (20 emittenti, esercizi 2024 e 2025)
#
# STATO: PROPOSTA, IN ATTESA DI APPROVAZIONE. Il download (Passo 4) rifiuta di
# partire finche' `status` non e' "approvata" e i campi di approvazione non sono
# compilati da chi approva.
#
# ATTENZIONE: settore, indice FTSE Italia e appartenenza al segmento STAR sono
# PROPOSTE dell'assistente basate su conoscenza generale, NON verificate.
# filings.xbrl.org non riporta queste informazioni. Vanno confermate su fonti
# ufficiali (Borsa Italiana / Euronext Milan, composizione indici FTSE Italia e
# segmento STAR) alla data di riferimento che sceglierete: la composizione degli
# indici cambia a ogni revisione trimestrale.
#
# Criteri di eleggibilita' applicati dal codice (src/extraction/sources/sample.py):
#   - relazione con xBRL-JSON per entrambi gli esercizi;
#   - chiusura dell'esercizio al 31/12 (esercizi non solari esclusi: vedi README);
#   - data nel nome del file coerente con il period_end dell'API.
# L'elenco di tutti gli emittenti eleggibili e' in data/interim/eligible_issuers.csv,
# per sostituire facilmente un candidato.

status: proposta            # proposta | approvata
approved_by: null           # da compilare da chi approva
